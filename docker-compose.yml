version: "3.8"

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build: ./backend
    volumes:
      - ./data:/app/data
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/novel.db
      - JWT_SECRET=${JWT_SECRET:-changeme_generate_a_random_secret}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
    restart: unless-stopped
